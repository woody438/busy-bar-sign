# Generate the Xcode project with:  xcodegen generate
# Change build settings here, not in Xcode — regenerating replaces the project.
name: BusyBarSign
options:
  bundleIdPrefix: com.woodall
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "2.8.4"
    CURRENT_PROJECT_VERSION: "2"           # CI sets the run number: the updater installs higher builds
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"          # Sign to Run Locally: no Apple developer team needed
    ENABLE_HARDENED_RUNTIME: NO      # a personal, un-notarised build
targets:
  BusyBarSign:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets   # the app icon (drawn by tools/icon/make_icon.py)
    dependencies:
      # the screen saver, carried in Contents/PlugIns and installed from there (SaverInstaller)
      - target: BusyBarSignSaver
        embed: true
        codeSign: true
        copy:
          destination: plugins
    info:
      path: Resources/Info.plist        # generated by XcodeGen from the keys below
      properties:
        CFBundleName: Busy Bar Sign
        CFBundleDisplayName: Busy Bar Sign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        NSHighResolutionCapable: true
        # Not expected to be asked for — the app only checks whether devices are
        # in use, it never records — but macOS would quit the app outright if it
        # ever did ask and these were missing.
        NSMicrophoneUsageDescription: Busy Bar Sign checks whether any app is using the microphone. It never records audio.
        NSCameraUsageDescription: Busy Bar Sign checks whether any app is using the camera. It never captures video.
        # Asked for on first launch: the sign follows your calendar (read-only).
        NSCalendarsFullAccessUsageDescription: Busy Bar Sign reads your calendar to show meetings, lunch and time away on the sign, and to warn people before a call. It never changes your calendar.
        NSCalendarsUsageDescription: Busy Bar Sign reads your calendar to show meetings, lunch and time away on the sign, and to warn people before a call. It never changes your calendar.
        # Which GitHub release this build is from: CI sets "preview" for a pull request's build,
        # which starts with Settings ▸ Updates ▸ Get preview builds on.
        BBSUpdateChannel: $(UPDATE_CHANNEL)
        # The pull request a preview build was built from, for Settings ▸ Updates: CI sets it.
        BBSPreviewPR: $(PREVIEW_PR)
    settings:
      base:
        PRODUCT_NAME: Busy Bar Sign            # the name in Finder and the Dock
        PRODUCT_MODULE_NAME: BusyBarSign
        PRODUCT_BUNDLE_IDENTIFIER: com.woodall.BusyBarSign
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        UPDATE_CHANNEL: latest
        PREVIEW_PR: ""
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}                           # a shared scheme, so xcodebuild can build it headless

  # The screen saver: the sign on every screen while the Mac is locked.
  # The bar's engine, LEDs and geometry are the app's own files, compiled in again.
  BusyBarSignSaver:
    type: bundle
    platform: macOS
    sources:
      - path: Saver
      - path: Sources/LocalAPI.swift
      - path: Sources/Bar/BarEngine.swift
      - path: Sources/Bar/PixelFonts.swift
      - path: Sources/Bar/FontData.swift
      - path: Sources/Bar/LEDRaster.swift
      - path: Sources/Bar/LEDPanelView.swift
      - path: Sources/Bar/BarGeometry.swift
    info:
      path: Resources/Saver-Info.plist  # generated by XcodeGen from the keys below
      properties:
        CFBundleName: Busy Bar Sign
        CFBundleDisplayName: Busy Bar Sign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: BusyBarSignSaverView   # @objc name: unique among every screen saver's classes
        NSHumanReadableCopyright: The Busy Bar Sign screen saver shows what the app's sign says.
    settings:
      base:
        PRODUCT_NAME: Busy Bar Sign            # "Busy Bar Sign" in the list of screen savers
        PRODUCT_MODULE_NAME: BusyBarSignSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.woodall.BusyBarSign.Saver
        WRAPPER_EXTENSION: saver
