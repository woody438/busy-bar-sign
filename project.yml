name: StudioCallSign
options:
  bundleIdPrefix: com.woodall
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
targets:
  StudioCallSign:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Studio Call Sign
        LSUIElement: false
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodall.StudioCallSign
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
