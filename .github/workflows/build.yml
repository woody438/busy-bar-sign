# Builds the Mac app and its Stream Deck plugin on GitHub's Mac runners and
# publishes them as the "latest" release, so they can be downloaded without Xcode:
#   https://github.com/woody438/busy-bar-sign/releases/latest
# Pull requests build and check too; their app is attached to the run
# (Actions ▸ the run ▸ Artifacts ▸ BusyBarSign) and published as the
# "preview" pre-release. The latest release is only built from main.
name: Build Mac app

on:
  push:
    branches: [main]
    # every build on main reaches everyone through the updater: words and pictures alone don't make one
    paths-ignore: ['**.md', 'docs/**', 'simulator/index.html', 'mock.html']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # to publish the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      # the project's signing certificate, once it's been added (tools/make-signing-cert.sh)
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
      # each build's number, which the updater compares, and the release it goes to
      BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_CHANNEL: ${{ github.event_name == 'pull_request' && 'preview' || 'latest' }}
      PREVIEW_PR: ${{ github.event.pull_request.number }}         # empty for main's builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # what Stream Deck runs plugins on

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BusyBarSign.xcodeproj -scheme BusyBarSign \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" UPDATE_CHANNEL="$UPDATE_CHANNEL" PREVIEW_PR="$PREVIEW_PR" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Sources/|Saver/)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log                  # a failed build can still leave a partial app
          test -d "build/Build/Products/Release/Busy Bar Sign.app"

      # the screen saver loaded as macOS's host loads it, with a stand-in for the app
      - name: Check the screen saver loads and shows the sign
        run: |
          swiftc Checks/saver-load/main.swift -o "$RUNNER_TEMP/saver-load"
          "$RUNNER_TEMP/saver-load" "build/Build/Products/Release/Busy Bar Sign.app/Contents/PlugIns/Busy Bar Sign.saver"

      # Signed with the project's certificate, macOS knows each build as the same app,
      # so Accessibility carries over between updates; ad hoc, each build looks new.
      - name: Sign with the project's certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          tools/sign.sh "build/Build/Products/Release/Busy Bar Sign.app" "$RUNNER_TEMP/cert.p12" "$SIGNING_CERT_PASSWORD"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Check signing works (no certificate yet, so a throwaway one, on a copy)
        if: env.HAS_SIGNING_CERT != 'true'
        run: |
          PASS=$(tools/make-signing-cert.sh "$RUNNER_TEMP/test.p12")
          ditto "build/Build/Products/Release/Busy Bar Sign.app" "$RUNNER_TEMP/Test.app"
          tools/sign.sh "$RUNNER_TEMP/Test.app" "$RUNNER_TEMP/test.p12" "$PASS"
          echo "::notice::Signed ad hoc: add SIGNING_CERT_P12 and SIGNING_CERT_PASSWORD (tools/make-signing-cert.sh) so permissions survive updates"

      - name: Package
        run: |
          APP="build/Build/Products/Release/Busy Bar Sign.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP" 2>&1 | grep designated                    # what macOS knows this build by
          lipo -info "$APP/Contents/MacOS/Busy Bar Sign"
          SAVER="$APP/Contents/PlugIns/Busy Bar Sign.saver"                # the screen saver it installs
          codesign --verify --strict --verbose=2 "$SAVER"
          lipo -info "$SAVER/Contents/MacOS/Busy Bar Sign" | grep -Eq "x86_64 arm64|arm64 x86_64"     # Intel Macs too
          test "$(plutil -extract NSPrincipalClass raw "$SAVER/Contents/Info.plist")" = "BusyBarSignSaverView"
          test "$(plutil -extract CFBundleVersion raw "$SAVER/Contents/Info.plist")" = "$BUILD_NUMBER"
          test -f "$APP/Contents/Resources/AppIcon.icns"                 # the icon made it in
          plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$BUILD_NUMBER"
          test "$(plutil -extract BBSUpdateChannel raw "$APP/Contents/Info.plist")" = "$UPDATE_CHANNEL"
          if [ "$UPDATE_CHANNEL" = preview ]; then                         # Settings says which pull request
            test "$(plutil -extract BBSPreviewPR raw "$APP/Contents/Info.plist")" = "$PREVIEW_PR"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" BusyBarSign.zip
          ls -l BusyBarSign.zip
          # what the updater reads (Sources/UpdateCheck.swift)
          cat > BusyBarSign.json <<EOF
          {"build": $BUILD_NUMBER, "version": "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")", "commit": "$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)", "channel": "$UPDATE_CHANNEL", "plugin": "$(plutil -extract Version raw streamdeck/com.woodall.busybarsign.sdPlugin/manifest.json)"}
          EOF
          cat BusyBarSign.json

      - name: Build the Stream Deck plugin
        run: |
          cd streamdeck
          npm ci
          npm run pack
          cp dist/com.woodall.busybarsign.streamDeckPlugin ../BusyBarSign.streamDeckPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: BusyBarSign
          path: |
            BusyBarSign.zip
            BusyBarSign.streamDeckPlugin
            BusyBarSign.json

      # before publishing: a published build reaches every copy through the updater
      - name: Checks (parity, geometry, frame time, detector, rules, mute, meeting keys, wall hours, away keys, local API, screen saver, Stream Deck plugin)
        run: |
          set -o pipefail
          Checks/run.sh 2>&1 | tee checks.log
          grep -q "^all checks passed" checks.log      # every check ran to the end

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BusyBarSign.zip BusyBarSign.streamDeckPlugin BusyBarSign.json \
            --target "$GITHUB_SHA" \
            --title "Busy Bar Sign — latest build" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}.

          **Install:** download BusyBarSign.zip, double-click to unzip, drag **Busy Bar Sign** to Applications.

          **First open:** the app isn't notarised by Apple, so macOS blocks it the first time. Try to open it, then go to System Settings ▸ Privacy & Security, scroll down and click **Open Anyway**. (Or in Terminal: \`xattr -dr com.apple.quarantine /Applications/Busy\\ Bar\\ Sign.app\`.)

          **Stream Deck:** download BusyBarSign.streamDeckPlugin and double-click it, then drag **Busy Bar Sign ▸ Status** onto a key — and **Mute** and **Leave** for Teams and Zoom meetings (they need Accessibility for Busy Bar Sign; remove the old Teams Meeting Keys plugin). Needs Stream Deck 7.1 or later.

          Needs macOS 14.4 or later."

      - name: Publish a pull request's build as the preview release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview BusyBarSign.zip BusyBarSign.streamDeckPlugin BusyBarSign.json --prerelease \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "Busy Bar Sign — preview (PR #${{ github.event.pull_request.number }})" \
            --notes "Built from pull request #${{ github.event.pull_request.number }} (\`${{ github.head_ref }}\`) at ${{ github.event.pull_request.head.sha }}. For testing; the latest release is still the one built from main.

          **Already have Busy Bar Sign 2.4.2 or later?** Settings ▸ Status ▸ Updates (from 2.6, Settings ▸ Updates) ▸ **Get preview builds**, and it installs this as it does an update.

          **Install:** download BusyBarSign.zip, double-click to unzip, drag **Busy Bar Sign** to Applications (replacing the old one).

          **First open:** the app isn't notarised by Apple, so macOS blocks it the first time. Try to open it, then go to System Settings ▸ Privacy & Security, scroll down and click **Open Anyway**. Allow calendar access when it asks.

          **Stream Deck:** double-click BusyBarSign.streamDeckPlugin to install or update the plugin. New: **Mute** and **Leave** keys for Teams and Zoom (Settings ▸ Call apps; remove the old Teams Meeting Keys plugin).

          **Accessibility:** if Settings ▸ Call apps says it isn't allowed though Busy Bar Sign is switched on in Privacy & Security ▸ Accessibility, that entry belongs to an older build: press **Reset and ask again**, then switch it on."

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
