# Builds the Mac app on GitHub's Mac runners and publishes it as the
# "latest" release, so it can be downloaded without Xcode:
#   https://github.com/woody438/busy-bar-sign/releases/latest
# Pull requests build and check too; their app is attached to the run
# (Actions ▸ the run ▸ Artifacts ▸ BusyBarSign) and the release is left alone.
name: Build Mac app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # to publish the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BusyBarSign.xcodeproj -scheme BusyBarSign \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(Sources/)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log                  # a failed build can still leave a partial app
          test -d "build/Build/Products/Release/Busy Bar Sign.app"

      - name: Package
        run: |
          APP="build/Build/Products/Release/Busy Bar Sign.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Busy Bar Sign"
          test -f "$APP/Contents/Resources/AppIcon.icns"                 # the icon made it in
          plutil -extract CFBundleIconName raw "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" BusyBarSign.zip
          ls -l BusyBarSign.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BusyBarSign
          path: BusyBarSign.zip

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BusyBarSign.zip \
            --target "$GITHUB_SHA" \
            --title "Busy Bar Sign — latest build" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}.

          **Install:** download BusyBarSign.zip, double-click to unzip, drag **Busy Bar Sign** to Applications.

          **First open:** the app isn't notarised by Apple, so macOS blocks it the first time. Try to open it, then go to System Settings ▸ Privacy & Security, scroll down and click **Open Anyway**. (Or in Terminal: \`xattr -dr com.apple.quarantine /Applications/Busy\\ Bar\\ Sign.app\`.)

          Needs macOS 14.4 or later."

      - name: Checks (parity, geometry, frame time, detector)
        run: |
          set -o pipefail
          Checks/run.sh 2>&1 | tee checks.log
          grep -q "^all checks passed" checks.log      # every check ran to the end

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
